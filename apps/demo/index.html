<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticity OS — Viral Loop Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 40px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 32px; }
    .btn { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 24px; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #1e3a5f; cursor: not-allowed; }
    .timeline { display: flex; flex-direction: column; gap: 12px; max-width: 800px; }
    .step { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; opacity: 0; transition: opacity 0.3s; }
    .step.visible { opacity: 1; }
    .step h3 { font-size: 15px; color: #60a5fa; margin-bottom: 8px; }
    .step .detail { font-size: 13px; color: #aaa; line-height: 1.5; }
    .step .credential { font-family: monospace; font-size: 11px; color: #4ade80; margin-top: 8px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; background: #0f0f0f; padding: 8px; border-radius: 4px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-valid { background: #166534; color: #4ade80; }
    .badge-invalid { background: #991b1b; color: #f87171; }
  </style>
</head>
<body>
  <h1>Authenticity OS</h1>
  <p class="subtitle">Viral Loop Demo — Watch agents discover, vouch, attest, and verify</p>
  <button class="btn" id="runBtn">Run Demo</button>
  <div class="timeline" id="timeline"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
