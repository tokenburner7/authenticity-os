<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticity OS — Brand Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 40px; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 24px; margin-bottom: 16px; max-width: 700px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    textarea, input { width: 100%; background: #0f0f0f; border: 1px solid #333; border-radius: 8px; padding: 12px; color: #e0e0e0; font-family: monospace; font-size: 12px; margin-bottom: 16px; resize: vertical; }
    textarea { min-height: 120px; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .result { margin-top: 16px; }
    .stat { display: inline-block; margin-right: 24px; }
    .stat-label { font-size: 11px; color: #666; text-transform: uppercase; }
    .stat-value { font-size: 18px; font-weight: bold; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-valid { background: #166534; color: #4ade80; }
    .badge-invalid { background: #991b1b; color: #f87171; }
    .badge-pending { background: #1e3a5f; color: #60a5fa; }
  </style>
</head>
<body>
  <h1>Brand Verification Portal</h1>
  <p class="subtitle">Verify creator authenticity, content provenance, and compliance status</p>

  <div class="card">
    <label for="credential">Paste a creator's credential JSON:</label>
    <textarea id="credential" placeholder='{"payload":{"type":"creation",...},"signature":"...","signer":"..."}'></textarea>
    <button class="btn" id="verifyBtn">Verify Creator</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h3 style="font-size:15px; color:#60a5fa; margin-bottom:16px;">Verification Results</h3>
    <div id="result"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
